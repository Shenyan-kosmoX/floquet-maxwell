name: Python and native-field checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install project and comparison dependencies
        run: python -m pip install '.[legume,test,sphere]'
      - name: Check software and physical controls
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest-results.xml
      - name: Run native Legume example in a new directory
        run: python sptc_toolbox/scripts/reproduce_jin2025_tensor.py --gmax 4.1 --grid-size 9 --output .sors-runs/ci-jin
      - name: Plot the computed result
        run: python sptc_toolbox/scripts/plot_jin2025_tensor.py --dataset .sors-runs/ci-jin/n3.47_g4.1_N9/coupling.npz --output .sors-runs/ci-plot
      - name: Save verification report and computed figure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floquet-checks
          path: |
            pytest-results.xml
            .sors-runs/ci-jin/n3.47_g4.1_N9/summary.json
            .sors-runs/ci-plot/computed.png
            .sors-runs/ci-plot/plot_metrics.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
