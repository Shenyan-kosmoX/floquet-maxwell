[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptc-fig4"
version = "0.1.0"
description = "Auditable first-order Floquet-Maxwell eigenfrequency benchmarks"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "matplotlib==3.10.3", "PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.29.5"]
legume = ["legume-gme==1.0.3"]

[project.scripts]
ptc-validate = "ptc_fig4.validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
